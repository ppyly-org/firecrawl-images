          '${{ steps.subject.outputs.digest }}'

      - name: Attest published Playwright digest
        id: postpush_attestation
        if: ${{ github.ref_protected == true && steps.push.outputs.digest != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.PLAYWRIGHT_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Runs after publish on purpose: oci:// verification fetches the
      # manifest from the registry, so this proves exactly what an image
      # consumer's `gh attestation verify` will see.
      - name: Verify published Playwright provenance
        id: verify_published_attestation
        if: ${{ github.ref_protected == true && steps.push.outputs.digest != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify 'oci://${{ env.PLAYWRIGHT_REPOSITORY }}@${{ steps.push.outputs.digest }}' --repo "$GITHUB_REPOSITORY"

