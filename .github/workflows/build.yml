        run: >-
          docker build
          --file Dockerfile.hardening.playwright
          --build-arg 'BASE_IMAGE=${{ steps.meta.outputs.upstream_image }}'
          --tag '${{ steps.meta.outputs.local_image }}'
          --tag '${{ env.PLAYWRIGHT_REPOSITORY }}:${{ steps.meta.outputs.version }}'
          --tag "${PLAYWRIGHT_REPOSITORY}:sha-${GITHUB_SHA}"
          .

      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local_image }}
          format: sarif
          output: playwright-trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln
          limit-severities-for-sarif: true

      - name: Preserve Playwright vulnerability evidence
        id: trivy_report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl-playwright-trivy-${{ github.sha }}
          path: playwright-trivy.sarif
          if-no-files-found: error

      - name: Enforce Playwright vulnerability gate
        id: trivy_gate
        run: >-
          trivy image
          --cache-dir .cache/trivy
          --scanners vuln
          --ignore-unfixed
          --severity CRITICAL,HIGH
          --exit-code 1
          --ignorefile security/accepted-risks-playwright.trivyignore.yaml
          '${{ steps.meta.outputs.local_image }}'

      - name: Generate Playwright SBOM
        id: sbom
        uses: anchore/sbom-action@v0.20.6
        with:
          image: ${{ steps.meta.outputs.local_image }}
          format: spdx-json
          output-file: playwright.spdx.json
          upload-artifact: false

      - name: Materialize exact local publishable OCI subject
        id: subject
        run: |
          set -euo pipefail
          docker save '${{ steps.meta.outputs.local_image }}' --output playwright-image.tar
          digest="$(crane digest --tarball playwright-image.tar)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "archive=playwright-image.tar"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test Playwright image
        id: smoke
        run: scripts/smoke-images.sh playwright '${{ steps.meta.outputs.local_image }}'

      - name: Upload pre-push Playwright security evidence
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl-playwright-security-evidence-${{ github.sha }}
          path: |
            playwright-trivy.sarif
            playwright.spdx.json
          if-no-files-found: error

      - name: Log in to GHCR
        id: login
        if: ${{ github.ref_protected == true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified Playwright archive to GHCR
        id: push
        if: ${{ github.ref_protected == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          scripts/publish-ghcr.sh
          '${{ steps.subject.outputs.archive }}'
