name: Build verified Firecrawl images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      task8_evidence:
        description: Immutable Task 8 live-rollout evidence digest (reserved; certification remains blocked)
        required: false
        type: string
      pg_cron_digest:
        description: Published pg_cron sha256 digest (reserved; certification remains blocked)
        required: false
        type: string

permissions:
  contents: read

env:
  API_REPOSITORY: ghcr.io/ppyly-org/firecrawl-api
  PLAYWRIGHT_REPOSITORY: ghcr.io/ppyly-org/firecrawl-playwright
  MIGRATION_REPOSITORY: ghcr.io/ppyly-org/firecrawl-nuq-migration
  PGCRON_REPOSITORY: ghcr.io/ppyly-org/pg-cron
  PGCRON_VERSION: 1.6.7-18
  MCP_REPOSITORY: ghcr.io/ppyly-org/firecrawl-mcp
  MCP_VERSION: 3.23.0

jobs:
  api:
    name: Verify and publish API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out image repository
        uses: actions/checkout@v4

      - name: Run repository tests
        run: |
          set -euo pipefail
          scripts/fetch-upstream.sh
          python3 -m unittest tests/test_workflow.py -v
          for test_script in tests/*.sh; do bash "$test_script"; done

      - name: Prepare exact source metadata
        id: meta
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < UPSTREAM_VERSION)"
          commit="$(tr -d '\n' < UPSTREAM_COMMIT)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "upstream_image=local/firecrawl-api-upstream:${GITHUB_SHA}"
            echo "local_image=local/firecrawl-api:${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize pristine exact-commit API context
        id: materialize
        run: |
          set -euo pipefail
          scripts/fetch-upstream.sh
          commit="$(tr -d '\n' < UPSTREAM_COMMIT)"
          git -C vendor/firecrawl cat-file -e "${commit}^{commit}"
          # materialize-upstream uses git archive UPSTREAM_COMMIT as its sole input.
          scripts/materialize-upstream.sh
          test ! -e .generated/firecrawl/.git
          test -f .generated/firecrawl/apps/api/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Build API locally without pushing
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .generated/firecrawl/apps/api
          file: .generated/firecrawl/apps/api/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.upstream_image }}

      # Fixes what upstream does not pin on purpose (stale base-image OS
      # packages, bundled npm CLI); the scanned/attested/published image is
      # exclusively this hardened derivative. Plain docker build: the buildx
      # container builder cannot FROM a daemon-loaded local image.
      - name: Apply API security hardening layer
        id: harden
        run: >-
          docker build
          --file Dockerfile.hardening.api
          --build-arg 'BASE_IMAGE=${{ steps.meta.outputs.upstream_image }}'
          --tag '${{ steps.meta.outputs.local_image }}'
          --tag '${{ env.API_REPOSITORY }}:${{ steps.meta.outputs.version }}'
          --tag "${API_REPOSITORY}:sha-${GITHUB_SHA}"
          .

      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local_image }}
          format: sarif
          output: api-trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln
          limit-severities-for-sarif: true

      - name: Preserve API vulnerability evidence
        id: trivy_report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl-api-trivy-${{ github.sha }}
          path: api-trivy.sarif
          if-no-files-found: error

      - name: Enforce API vulnerability gate
        id: trivy_gate
        run: >-
          trivy image
          --cache-dir .cache/trivy
          --scanners vuln
          --ignore-unfixed
          --severity CRITICAL,HIGH
          --exit-code 1
          --ignorefile security/accepted-risks-api.trivyignore.yaml
          '${{ steps.meta.outputs.local_image }}'

      - name: Generate API SBOM
        id: sbom
        uses: anchore/sbom-action@v0.20.6
        with:
          image: ${{ steps.meta.outputs.local_image }}
          format: spdx-json
          output-file: api.spdx.json
          upload-artifact: false

      - name: Materialize exact local publishable OCI subject
        id: subject
        run: |
          set -euo pipefail
          docker save '${{ steps.meta.outputs.local_image }}' --output api-image.tar
          digest="$(crane digest --tarball api-image.tar)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "archive=api-image.tar"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test API image
        id: smoke
        run: scripts/smoke-images.sh api '${{ steps.meta.outputs.local_image }}'

      - name: Upload pre-push API security evidence
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl-api-security-evidence-${{ github.sha }}
          path: |
            api-trivy.sarif
            api.spdx.json
          if-no-files-found: error

      - name: Log in to GHCR
        id: login
        if: ${{ github.ref_protected == true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified API archive to GHCR
        id: push
        if: ${{ github.ref_protected == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          scripts/publish-ghcr.sh
          '${{ steps.subject.outputs.archive }}'
          '${{ env.API_REPOSITORY }}'
          '${{ steps.meta.outputs.version }}'
          "sha-${GITHUB_SHA}"
          '${{ steps.subject.outputs.digest }}'

      - name: Attest published API digest
        id: postpush_attestation
        if: ${{ github.ref_protected == true && steps.push.outputs.digest != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.API_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Runs after publish on purpose: oci:// verification fetches the
      # manifest from the registry, so this proves exactly what an image
      # consumer's `gh attestation verify` will see.
      - name: Verify published API provenance
        id: verify_published_attestation
        if: ${{ github.ref_protected == true && steps.push.outputs.digest != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify 'oci://${{ env.API_REPOSITORY }}@${{ steps.push.outputs.digest }}' --repo "$GITHUB_REPOSITORY"

  playwright:
    name: Verify and publish Playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out image repository
        uses: actions/checkout@v4

      - name: Run repository tests
        run: |
          set -euo pipefail
          scripts/fetch-upstream.sh
          python3 -m unittest tests/test_workflow.py -v
          for test_script in tests/*.sh; do bash "$test_script"; done

      - name: Prepare exact source metadata
        id: meta
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < UPSTREAM_VERSION)"
          commit="$(tr -d '\n' < UPSTREAM_COMMIT)"
