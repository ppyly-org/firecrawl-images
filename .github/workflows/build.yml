          # materialize-upstream uses git archive UPSTREAM_COMMIT as its sole input.
          scripts/materialize-upstream.sh
          test ! -e .generated/firecrawl/.git
          test -f .generated/firecrawl/apps/playwright-service-ts/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Build Playwright locally without pushing
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .generated/firecrawl/apps/playwright-service-ts
          file: .generated/firecrawl/apps/playwright-service-ts/Dockerfile
          build-args: PORT=3000
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.upstream_image }}

      # Fixes stale base-image OS packages and drops the bundled npm CLI
      # (CMD becomes the literal expansion of upstream's `npm start`). Plain
      # docker build: the buildx container builder cannot FROM a
      # daemon-loaded local image.
      - name: Apply Playwright security hardening layer
